<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Nepal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Nepal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="culture.html">Culture</a></li>
            <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
            <li class="nav-item"><a class="nav-link" href="food.html">Food</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="page-banner contact-banner">
      <div class="overlay"></div>
      <div class="container banner-content text-white">
        <p class="eyebrow">Get in touch</p>
        <h1>Contact Us</h1>
      </div>
    </header>

    <main class="py-5">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-5">
            <p class="section-tag">Plan your trip</p>
            <h2>Let’s start your Nepal journey</h2>
            <div class="contact-info mt-4">
              <p><strong>Phone:</strong> +977-1-4567890</p>
              <p><strong>Email:</strong> hello@nepaltourguide.com</p>
              <p><strong>Address:</strong> Kathmandu, Nepal</p>
            </div>
          </div>

          <div class="col-lg-7">
            <form class="contact-form">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="name" class="form-label">Full Name</label>
                  <input id="name" type="text" class="form-control" placeholder="Your name" />
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input id="email" type="email" class="form-control" placeholder="Your email" />
                </div>
                <div class="col-12">
                  <label for="subject" class="form-label">Subject</label>
                  <input id="subject" type="text" class="form-control" placeholder="Trip inquiry" />
                </div>
                <div class="col-12">
                  <label for="message" class="form-label">Message</label>
                  <textarea id="message" class="form-control" rows="5" placeholder="Tell us about your travel plans"></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white py-4">
      <div class="container d-flex justify-content-between flex-wrap align-items-center gap-3">
        <p class="mb-0">© <span id="year"></span> Nepal Travel Guide</p>
        <p class="mb-0">Start planning your adventure</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
